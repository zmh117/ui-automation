schema: spec-driven

context: |
  所有说明及 OpenSpec 产物正文使用简体中文。
  保留 OpenSpec 模板要求的英文结构标题、Requirement/Scenario 标记及 SHALL/MUST/WHEN/THEN 等规范关键词；代码标识符、命令和路径不翻译。
  本项目用于 MES Web 系统的 UI 自动化测试设计与建设，业务包括生产配置、生产管理、生产执行。
  首阶段关注主配方配置、工单、生产执行的完整业务链路。
  现有资料为 MES_UI自动化测试方案.md 与 ascii页面图/；方案为评审稿，页面资料为部分快照，不代表已实现能力或完整业务规格。
  需求不清时，必须先向用户确认规格，不能直接实施；不得从页面示例推定库存扣减、取消回退、签名或版本绑定规则。
  默认选择稳健方案，同时避免过度设计和难以维护的抽象。
  保留用户已有文件和未提交工作；区分方案设计、本地或模拟测试、真实 MES 与设备联调证据。

rules:
  proposal:
    - 使用中文说明问题、变更范围、影响和待确认事项；不得把评审稿中的建议直接当作已批准需求。
  design:
    - 说明关键职责、数据流向、断言依据、数据隔离和失败处理；图示应帮助评审具体业务行为。
  specs:
    - 用明确的前置条件、动作、预期结果和禁止副作用描述场景；预期值来自已确认业务规则。
    - 区分 UI 展示、接口业务结果、数据库持久化与 Redis 职责，按事实确定权威来源。
  tasks:
    - 任务应具有可验证的完成条件；实现、静态检查、模拟验证与真实环境验收分别列明。
    - 未实际执行或仍待业务确认的任务保持未完成状态。
